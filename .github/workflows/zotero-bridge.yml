name: zotero-bridge

on:
  push:
    paths:
      - "zotero-bridge/**"
      - ".github/workflows/zotero-bridge.yml"
  pull_request:
    paths:
      - "zotero-bridge/**"
      - ".github/workflows/zotero-bridge.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zotero-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zotero-bridge/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-bridge-xpi
          path: zotero-bridge/dist/*.xpi
